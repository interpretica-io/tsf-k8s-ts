# Engine and agent are built for the same platform: the agent runs on the
# engine host (the build container, or this machine for a native run). The
# suite's audits run in the engine process; the agent exists only to run
# docker, curl and kubectl for them, which it does through the stock job
# RPCs. No agent-side code of the suite's own is needed.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external libraries this suite builds on, engine-side only. Their
# references live in conf/external.yml and the commits built in
# conf/builder.conf.lock. The audits report through tapi_cybersec, which is
# built on tapi_kernel, which is built on tapi_devtool - so the whole chain
# is pulled in. None of them has agent-side code here.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])

# The stock job RPCs on the agent.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic engine restricted to the protocols actually needed (tapi_cybersec
# sniff rules pull it in); without this the meson build pulls the full default
# set, which includes SNMP and is unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application the agent runs tools out of: the stock job
# server, which is all the suite needs to start docker, curl and kubectl.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib \
           rpcxdrta rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
